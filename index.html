<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4bdb">
  <title>Idealist</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="back" class="ibtn plain" hidden aria-label="Back" title="Back"><span data-icon="back"></span></button>
    <h1 id="title">Idealist</h1>
    <button id="open-settings" class="ibtn plain" aria-label="Settings" title="Settings"><span data-icon="sliders"></span></button>
  </header>

  <main>
    <!-- Home: tasks and ideas on one screen -->
    <section id="view-home" class="view">
      <section class="block">
        <div class="block-head">
          <h2>Tasks</h2>
          <span id="task-count" class="count"></span>
          <button class="ibtn accent" data-go="task" aria-label="Add task" title="Add task"><span data-icon="plus"></span></button>
        </div>
        <ul id="task-list" class="cards"></ul>
        <p id="task-empty" class="empty" hidden>Nothing here yet</p>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>Ideas</h2>
          <span id="idea-count" class="count"></span>
          <button class="ibtn accent amber" data-go="idea" aria-label="Add idea" title="Add idea"><span data-icon="plus"></span></button>
        </div>
        <ul id="idea-list" class="cards"></ul>
        <p id="idea-empty" class="empty" hidden>Nothing here yet</p>
      </section>

      <p id="queue-note" class="note" hidden></p>
    </section>

    <!-- Add idea -->
    <section id="view-idea" class="view" hidden>
      <div class="mic-wrap">
        <button id="idea-mic" class="mic" aria-label="Record" title="Record"><span data-icon="mic" data-size="34"></span></button>
        <span id="idea-hint" class="hint"></span>
      </div>
      <textarea id="idea-text" rows="6" placeholder="Speak or type your idea"></textarea>
      <label for="idea-due">Complete by (optional)</label>
      <input id="idea-due" type="datetime-local">
      <div class="chips">
        <button class="chip" data-idue="2h">In 2 hours</button>
        <button class="chip" data-idue="today6">Today 6 PM</button>
        <button class="chip" data-idue="tom9">Tomorrow 9 AM</button>
        <button class="chip" data-idue="nextweek">Next week</button>
      </div>
      <button id="idea-save" class="primary save" aria-label="Save idea" title="Save idea"><span data-icon="check" data-size="26"></span></button>
    </section>

    <!-- Add task -->
    <section id="view-task" class="view" hidden>
      <div class="mic-wrap">
        <button id="task-mic" class="mic" aria-label="Record" title="Record"><span data-icon="mic" data-size="34"></span></button>
        <span id="task-hint" class="hint"></span>
      </div>
      <textarea id="task-text" rows="4" placeholder="Speak or type your task"></textarea>
      <label for="task-due">Get it done by</label>
      <input id="task-due" type="datetime-local">
      <div class="chips">
        <button class="chip" data-due="2h">In 2 hours</button>
        <button class="chip" data-due="today6">Today 6 PM</button>
        <button class="chip" data-due="tom9">Tomorrow 9 AM</button>
      </div>
      <label class="check" title="Also add to Google Calendar">
        <input id="task-cal" type="checkbox" aria-label="Also add to Google Calendar">
        <span data-icon="calendar" data-size="22"></span>
      </label>
      <button id="task-save" class="primary save" aria-label="Save task" title="Save task"><span data-icon="check" data-size="26"></span></button>
    </section>

    <!-- Settings -->
    <section id="view-settings" class="view" hidden>
      <label for="set-url">Web app URL</label>
      <input id="set-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label for="set-secret">Secret</label>
      <input id="set-secret" type="text" placeholder="Same as SECRET in the script" autocomplete="off">
      <label for="set-lang">Voice language</label>
      <select id="set-lang">
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="hi-IN">Hindi</option>
      </select>
      <button id="set-save" class="primary">Save settings</button>
      <button id="set-test" class="link">Test connection</button>
    </section>
  </main>

  <!-- Reschedule dialog -->
  <dialog id="dlg-resched">
    <h2 id="resched-title">Reschedule</h2>
    <p id="resched-task" class="note"></p>
    <input id="resched-due" type="datetime-local">
    <div class="chips">
      <button class="chip" data-rdue="2h">In 2 hours</button>
      <button class="chip" data-rdue="today6">Today 6 PM</button>
      <button class="chip" data-rdue="tom9">Tomorrow 9 AM</button>
      <button class="chip" data-rdue="nextweek">Next week</button>
    </div>
    <div class="row">
      <button id="resched-cancel" class="secondary">Cancel</button>
      <button id="resched-save" class="primary">Save</button>
    </div>
  </dialog>

  <!-- Share fallback (used when the phone's share sheet isn't available) -->
  <dialog id="dlg-share">
    <h2>Share idea</h2>
    <div class="share-grid">
      <a id="sh-whatsapp" class="secondary" target="_blank" rel="noopener">WhatsApp</a>
      <a id="sh-telegram" class="secondary" target="_blank" rel="noopener">Telegram</a>
      <a id="sh-email" class="secondary">Email</a>
      <a id="sh-sms" class="secondary">SMS</a>
      <button id="sh-copy" class="secondary">Copy text</button>
      <button id="sh-close" class="secondary">Close</button>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
